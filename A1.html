<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A1｜情報入力</title>

  <link rel="stylesheet" href="A.css">
</head>

<body>

  <main class="a-page">

    <header class="a-header">

      <a href="../index.html" class="back">
        ← 一覧
      </a>

      <p class="step">A · STEP 1 / 3</p>

      <h1>A1</h1>

      <h2>情報入力</h2>

      <p>
        あなたについて教えてください
      </p>

    </header>


    <section class="a-form">

      <label>
        お名前
        <input
          id="name"
          type="text"
          placeholder="お名前を入力"
        >
      </label>


      <label>
        生年月日
        <input
          id="birthday"
          type="date"
        >
      </label>


      <label>
        今の気分
        <select id="mood">

          <option value="positive">前向き</option>
          <option value="calm">穏やか</option>
          <option value="thinking">考え中</option>
          <option value="challenge">挑戦したい</option>

        </select>
      </label>


      <button
        class="main-button"
        onclick="goA2()"
      >
        A2 結果を見る
      </button>

    </section>

  </main>

  <script src="A.js"></script>

</body>
</html>
