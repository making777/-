<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>B2｜診断結果</title>

  <link rel="stylesheet" href="B.css">

</head>

<body>

  <main class="b-page">

    <header class="b-header">

      <p class="step">B · STEP 2 / 3</p>

      <h1>B2</h1>

      <h2>あなたの魅力</h2>

    </header>


    <section
      id="result-card"
      class="b-result"
    >

      <div class="b-circle">
        B
      </div>

      <p class="label">
        YOUR CHARM
      </p>

      <h2 id="result-name">---</h2>

      <div class="bars">

        <div class="bar-item">

          <span>魅力</span>

          <div class="bar">
            <i id="bar1"></i>
          </div>

        </div>


        <div class="bar-item">

          <span>表現力</span>

          <div class="bar">
            <i id="bar2"></i>
          </div>

        </div>


        <div class="bar-item">

          <span>行動力</span>

          <div class="bar">
            <i id="bar3"></i>
          </div>

        </div>

      </div>


      <h3 id="result-title">---</h3>

      <p id="result-text">---</p>

    </section>


    <div class="buttons">

      <button
        class="main-button"
        onclick="goB3()"
      >
        B3 結果画像を作る
      </button>

      <a
        href="B1.html"
        class="sub-button"
      >
        B1に戻る
      </a>

    </div>

  </main>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="B.js"></script>

</body>
</html>
