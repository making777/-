<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B1｜情報入力</title>

  <link rel="stylesheet" href="B.css">
</head>

<body>

  <main class="b-page">

    <header class="b-header">

      <a href="../index.html" class="back">
        ← 一覧
      </a>

      <p class="step">B · STEP 1 / 3</p>

      <h1>B1</h1>

      <h2>情報入力</h2>

      <p>あなたの魅力について診断します</p>

    </header>


    <section class="b-form">

      <label>
        お名前
        <input
          id="name"
          type="text"
          placeholder="お名前を入力"
        >
      </label>


      <label>
        あなたが好きなのは？

        <select id="choice">

          <option value="people">人と話すこと</option>
          <option value="alone">一人の時間</option>
          <option value="create">何かを作ること</option>
          <option value="discover">新しいものを探すこと</option>

        </select>

      </label>


      <button
        class="main-button"
        onclick="goB2()"
      >
        B2 結果を見る
      </button>

    </section>

  </main>

  <script src="B.js"></script>
