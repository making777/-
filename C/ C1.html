<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>C1｜情報入力</title>

  <link rel="stylesheet" href="C.css">

</head>

<body>

  <main class="c-page">

    <header class="c-header">

      <a href="../index.html" class="back">
        ← 一覧
      </a>

      <p class="step">C · STEP 1 / 3</p>

      <h1>C1</h1>

      <h2>情報入力</h2>

      <p>あなたの感性を診断します</p>

    </header>


    <section class="c-form">

      <label>
        お名前

        <input
          id="name"
          type="text"
          placeholder="お名前を入力"
        >

      </label>


      <label>
        一番惹かれるもの

        <select id="choice">

          <option value="moon">
            月・夜空
          </option>

          <option value="flower">
            花・植物
          </option>

          <option value="ocean">
            海・水
          </option>

          <option value="star">
            星・宇宙
          </option>

        </select>

      </label>


      <button
        class="main-button"
        onclick="goC2()"
      >
        C2 結果を見る
      </button>

    </section>

  </main>

  <script src="C.js"></script>

</body>
</html>
