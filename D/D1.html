<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>D1｜情報入力</title>

  <link rel="stylesheet" href="D.css">

</head>

<body>

  <main class="d-page">

    <header class="d-header">

      <a href="../index.html" class="back">
        ← 一覧
      </a>

      <p class="step">D · STEP 1 / 3</p>

      <h1>D1</h1>

      <h2>情報入力</h2>

      <p>あなたの未来について診断します</p>

    </header>


    <section class="d-form">

      <label>

        お名前

        <input
          id="name"
          type="text"
          placeholder="お名前を入力"
        >

      </label>


      <label>

        今、一番大切にしたいこと

        <select id="choice">

          <option value="love">
            人とのつながり
          </option>

          <option value="work">
            仕事・才能
          </option>

          <option value="freedom">
            自由な時間
          </option>

          <option value="growth">
            成長・挑戦
          </option>

        </select>

      </label>


      <button
        class="main-button"
        onclick="goD2()"
      >
        D2 結果を見る
      </button>

    </section>

  </main>

  <script src="D.js"></script>

</body>
</html>
